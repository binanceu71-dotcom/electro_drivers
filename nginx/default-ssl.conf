upstream nextjs_upstream {
    server app:3000;
    keepalive 32;
}

# 1. HTTP Server — Certbot Challenge & HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name portal.electrodrivers.ru;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server — Production SSL & Next.js Proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.electrodrivers.ru;

    ssl_certificate /etc/letsencrypt/live/portal.electrodrivers.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.electrodrivers.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 120M;

    # ------------------------------------------------------------------
    # ВАЖНО (защита от «вечного» белого экрана):
    #  - Хешированная статика /_next/static кэшируется навсегда (immutable),
    #    имя файла меняется при каждой сборке — конфликтов не бывает.
    #  - HTML и API НИКОГДА не кэшируются (no-store): промежуточные кэши
    #    (CDN/Cloudflare/прокси) не смогут месяцами отдавать старую сборку.
    # add_header в location отменяет наследование, поэтому security-заголовки
    # продублированы в каждом location.
    # ------------------------------------------------------------------

    # Immutable Next.js static chunks
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # HTML pages, API, everything else — never cached
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }
}
